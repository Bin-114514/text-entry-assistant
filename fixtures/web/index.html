<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文字输入助手合成夹具</title>
  <style>body{font:16px system-ui;max-width:760px;margin:2rem auto}section{margin:1rem 0;padding:1rem;border:1px solid #cbd5e1}textarea,[contenteditable]{display:block;width:100%;min-height:80px;margin-top:.5rem;padding:.5rem}</style>
</head>
<body>
  <h1>合成输入区域</h1>
  <section><label>Textarea<textarea id="textarea"></textarea></label></section>
  <section><label>Contenteditable<div id="contenteditable" contenteditable="true"></div></label></section>
  <section><label>同源 iframe<iframe id="editor-frame" title="同源 iframe" src="iframe.html" style="width:100%;height:120px"></iframe></label></section>
  <section><label>受控组件<input id="controlled" value="" style="width:100%;padding:.5rem"></label><output id="controlled-output"></output></section>
  <section><label>拦截 paste<textarea id="paste-blocked"></textarea></label></section>
  <script>
    const controlled = document.querySelector('#controlled');
    const output = document.querySelector('#controlled-output');
    controlled.addEventListener('input', () => output.textContent = `input events: ${controlled.value.length}`);
    document.querySelector('#paste-blocked').addEventListener('paste', event => { event.preventDefault(); event.target.dataset.pasteBlocked = 'true'; });
  </script>
</body>
</html>
